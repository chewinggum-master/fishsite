<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小魚</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="site-shell">
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <div class="wordmark">for this moment</div>
        <span class="tag">FLOWER</span>
      </header>

      <section class="screen intro is-active" data-screen="intro">
        <!-- <p class="eyebrow">A LITTLE MEMORY</p> -->
        <h1>拍照</h1>
        <p class="lead">
          <!-- ???豢??銝撘萇??蝬脩?????望??暸脩?Ｚㄐ??-->
        </p>
        <div class="actions">
          <button class="primary" id="openCamera" type="button">
            <span aria-hidden="true">📷</span>
            開啟相機
          </button>
        </div>
      </section>

      <section class="camera-screen" data-screen="camera" aria-label="?豢??恍">
        <video id="cameraFeed" class="camera-feed" playsinline muted></video>
        <div class="viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="camera-hint">隨便拍拍(直的拜託) </p>
        <div class="camera-controls">
          <button class="small-round" id="closeCamera" type="button" aria-label="餈?">?</button>
          <button class="shutter" id="takePhoto" type="button" aria-label="?"><span></span></button>
        </div>
        <div class="camera-error" id="cameraError" hidden>
          <p>?⊥????豢????臭誑?寧?貊倏?抒???/p>
        </div>
      </section>

      <section class="screen developing" data-screen="developing">
        <div class="sparkle" aria-hidden="true"></div>
        <h2>逼哩逼哩</h2>
        <div class="loader" aria-hidden="true"><span></span></div>
      </section>

      <section class="screen result" data-screen="result">
        <figure class="photo-frame">
          <img id="resultImage" alt="???望?敺??抒?" />
          <figcaption>a flower found its way to you</figcaption>
        </figure>
        <div class="reveal-copy">
          <p class="eyebrow">ONE MORE THING</p>
          <h2>逼哩逼哩</h2>
          <p>耶</p>
        </div>
        <div class="result-actions">
          <a class="primary" id="downloadPhoto" download="flower-moment.jpg">下載圖片ㄦ </a>
          <button class="text-button" id="startOver" type="button">重新開始</button>
        </div>
      </section>

      <canvas id="canvas" class="hidden-canvas"></canvas>
    </main>

    <script src="script.js"></script>
  </body>
</html>
